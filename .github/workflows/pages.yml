name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses actions/configure-pages@v5
        with:
          publish_source: branch
      - uses actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
